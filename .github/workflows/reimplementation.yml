name: reimplementation

on:
  push:
    paths: ["reimplementation/**", "research/reports/**", ".github/workflows/reimplementation.yml"]
  pull_request:
    paths: ["reimplementation/**", "research/reports/**", ".github/workflows/reimplementation.yml"]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python3 -m unittest discover -s reimplementation/tests -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: "1.27.4" }
      - working-directory: reimplementation
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.25.0" }
      - uses: actions/setup-node@v6
        with: { node-version: "26.13.0", cache: "pnpm", cache-dependency-path: reimplementation/web/pnpm-lock.yaml }
      - working-directory: reimplementation/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test:docs
          pnpm run test:replay
          pnpm run test:plugins
          pnpm run build

  compose:
    runs-on: ubuntu-latest
    env:
      SPECTER_JWT_SECRET: "01234567890123456789012345678901"
      SPECTER_ADMIN_PASSWORD: "integration-test-password"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: "26.13.0" }
      - name: Validate Compose configuration
        working-directory: reimplementation
        run: docker compose config --quiet
      - name: Start Compose stack
        working-directory: reimplementation
        run: docker compose up --build --wait
      - name: Run Compose smoke test
        working-directory: reimplementation
        run: node tests/smoke.mjs
      - name: Print Compose logs on failure
        if: failure()
        working-directory: reimplementation
        run: docker compose logs --no-color
      - name: Stop Compose stack
        if: always()
        working-directory: reimplementation
        run: docker compose down --volumes
